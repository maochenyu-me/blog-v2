name: 打赏名单收录
description: 提交错过的赞赏记录，管理员核验后展示在关于页打赏名单
title: '打赏名单收录'
labels: ['打赏']
body:
  - type: markdown
    attributes:
      value: |
        感谢支持！提交前请确认：

        1. 金额与日期请与转账记录一致，截图必须清晰可辨
        2. 提交后由管理员人工核验，核验通过并关闭本议题后，数据自动写入关于页打赏名单
        3. 头像选填：不填时名单里会显示名称首字的占位头像

  - type: input
    id: name
    attributes:
      label: 赞赏者名称
      description: 展示在名单里的名字
      placeholder: '例如：深度求索'
    validations:
      required: true

  - type: input
    id: avatar
    attributes:
      label: 头像图片链接
      description: 选填，图片直链（png / jpg / webp）
      placeholder: 'https://example.com/avatar.png'
    validations:
      required: false

  - type: input
    id: amount
    attributes:
      label: 金额（元）
      description: 纯数字，可带两位小数
      placeholder: '例如：11.14'
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: 打赏日期
      description: 格式 YYYY-MM-DD
      placeholder: '例如：2026-10-15'
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: 转账截图
      description: 直接把截图粘贴到本输入框（会自动上传为附件链接），仅用于管理员核验，不会公开展示
      placeholder: '粘贴图片或填写图片直链'
    validations:
      required: true
