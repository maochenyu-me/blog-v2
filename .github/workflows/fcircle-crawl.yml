name: 友链朋友圈 · 生成

# 仅当 app/data/friend-links.json 发生变化时生成 public/fcircle.json。
# 生成文件有变化才提交 master，然后显式触发 deploy.yml 重建站点。
# GITHUB_TOKEN 的 push 不会自动触发其他 workflow（防递归），
# 所以必须用 workflow_dispatch 显式唤起部署。

on:
  push:
    branches: [master]
    paths:
      - app/data/friend-links.json
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fcircle-build
  cancel-in-progress: false

jobs:
  build:
    name: 生成 fcircle.json
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 生成数据
        run: node scripts/build-fcircle.mjs

      - name: 提交数据变更
        id: commit
        run: |
          if git diff --quiet -- public/fcircle.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "fcircle.json 无变化，跳过提交与重建"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/fcircle.json
            git commit -m "chore(fcircle): 根据友链数据更新 fcircle.json"
            git push origin HEAD:master
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 摘要
        if: always()
        run: |
          {
            echo "### 友链朋友圈数据生成"
            echo ""
            echo "- 友链数：$(jq '.friends | length' public/fcircle.json)"
            echo "- 是否触发重建：${{ steps.commit.outputs.changed == 'true' && '是' || '否（数据无变化）' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 触发站点重建
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master
